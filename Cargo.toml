[package]
name = "localcode"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A 100% local, on-device CLI AI coding agent (like Claude Code, but offline)"
license = "Apache-2.0"
default-run = "localcode"

[[bin]]
name = "localcode"
path = "src/main.rs"

[lib]
name = "localcode"
path = "src/lib.rs"

[dependencies]
# async runtime + process management
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "sync", "signal", "fs"] }
futures-util = "0.3"

# HTTP client for the local OpenAI-compatible llama-server endpoint + downloads
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }

# web search + fetch (the agent's "search the web" capability)
scraper = "0.20"
urlencoding = "2"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# errors + logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# files / search
ignore = "0.4"
regex = "1"
dirs = "5"
glob = "0.3"

# diff rendering for edit approvals
similar = "2"

# optional inline-viewport TUI (--tui); line mode stays the default
ratatui = { version = "0.30", features = ["scrolling-regions"] }
crossterm = "0.29"

# session persistence (bundled SQLite — no system dependency)
rusqlite = { version = "0.32", features = ["bundled"] }

# hardware scan + downloads (M3)
sysinfo = "0.33"
sha2 = "0.10"
indicatif = "0.17"
inquire = "0.7"

# auto-download + extract prebuilt llama-server release archives (M5)
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Linux-only: Landlock LSM to deny network to the bash sandbox (parity with the
# macOS Seatbelt profile). Best-effort — degrades cleanly on pre-6.7 kernels.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
